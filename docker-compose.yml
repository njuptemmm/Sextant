services:
  api:
    build: .
    image: sextant:0.1.0
    command: ["sextant", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      SEXTANT_WORKSPACE_ROOT: /app/workspace
      SEXTANT_HOST: 0.0.0.0
      SEXTANT_PORT: "8000"
      SEXTANT_LLM_BASE_URL: ${SEXTANT_LLM_BASE_URL:-}
      SEXTANT_LLM_API_KEY: ${SEXTANT_LLM_API_KEY:-}
      SEXTANT_LLM_MODEL: ${SEXTANT_LLM_MODEL:-}
      SEXTANT_MAX_RESULTS_PER_SOURCE: ${SEXTANT_MAX_RESULTS_PER_SOURCE:-20}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
    volumes:
      - ./workspace:/app/workspace
    restart: unless-stopped

  mcp:
    image: sextant:0.1.0
    command: ["sextant-mcp", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    environment:
      SEXTANT_WORKSPACE_ROOT: /app/workspace
      SEXTANT_HOST: 0.0.0.0
      SEXTANT_MCP_PORT: "8001"
      SEXTANT_LLM_BASE_URL: ${SEXTANT_LLM_BASE_URL:-}
      SEXTANT_LLM_API_KEY: ${SEXTANT_LLM_API_KEY:-}
      SEXTANT_LLM_MODEL: ${SEXTANT_LLM_MODEL:-}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
    volumes:
      - ./workspace:/app/workspace
    depends_on:
      - api
    healthcheck:
      disable: true
    restart: unless-stopped
