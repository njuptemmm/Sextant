[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sextant"
version = "0.1.0"
description = "Research intelligence agent: multi-source retrieval, relevance ranking and an auditable evidence catalog."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sextant contributors" }]
keywords = ["research", "mcp", "agent", "literature-review", "openalex", "arxiv"]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "mcp>=1.2,<2.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
sextant = "sextant.__main__:main"
sextant-mcp = "sextant.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["sextant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["sextant/engine"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
