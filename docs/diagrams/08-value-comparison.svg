  <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.05"/>
</filter>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
</defs>
<rect width="1500" height="860" fill="#F5F7FB"/>
<text x="60.0" y="62.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="30" font-weight="700" fill="#0F172A" text-anchor="start" opacity="1.0">场景价值：从 2–3.5 小时到 3–4 分钟</text><text x="60.0" y="92.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="14.5" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">同一主题、同一周；人工方式是保守估算，Sextant 数字来自真实运行</text><rect x="1349.0" y="42" width="91.0" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><circle cx="1364.0" cy="56" r="4.5" fill="#0D9488"/><text x="1376.0" y="60.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="600" fill="#64748B" text-anchor="start" opacity="1.0">可核验产物</text><rect x="1223.6" y="42" width="115.39999999999999" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><circle cx="1238.6" cy="56" r="4.5" fill="#2563EB"/><text x="1250.6" y="60.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="600" fill="#64748B" text-anchor="start" opacity="1.0">Sextant</text><rect x="1159.1999999999998" y="42" width="54.4" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><circle cx="1174.1999999999998" cy="56" r="4.5" fill="#64748B"/><text x="1186.2" y="60.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="600" fill="#64748B" text-anchor="start" opacity="1.0">人工</text><rect x="60" y="130" width="620" height="520" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/><text x="85.0" y="168.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="16" font-weight="700" fill="#64748B" text-anchor="start" opacity="1.0">现在：人工筛选</text><text x="85.0" y="192.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">每周 1–2 次，4–6 个入口来回切换</text><circle cx="102" cy="243" r="15" fill="#F1F5F9"/><text x="102.0" y="248.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="10.5" font-weight="700" fill="#64748B" text-anchor="middle" opacity="1.0">01</text><text x="130.0" y="239.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start" opacity="1.0">发现</text><text x="130.0" y="261.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">在 Scholar / arXiv / 数据库之间换关键词搜</text><text x="650.0" y="243.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="end" opacity="1.0">20–30 min</text><circle cx="102" cy="323" r="15" fill="#F1F5F9"/><text x="102.0" y="328.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="10.5" font-weight="700" fill="#64748B" text-anchor="middle" opacity="1.0">02</text><text x="130.0" y="319.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start" opacity="1.0">初筛</text><text x="130.0" y="341.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">逐条读标题和摘要，100 条左右</text><text x="650.0" y="323.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="end" opacity="1.0">70–100 min</text><circle cx="102" cy="403" r="15" fill="#F1F5F9"/><text x="102.0" y="408.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="10.5" font-weight="700" fill="#64748B" text-anchor="middle" opacity="1.0">03</text><text x="130.0" y="399.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start" opacity="1.0">整理</text><text x="130.0" y="421.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">把作者、年份、链接粘进文档</text><text x="650.0" y="403.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="end" opacity="1.0">30–60 min</text><circle cx="102" cy="483" r="15" fill="#F1F5F9"/><text x="102.0" y="488.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="10.5" font-weight="700" fill="#64748B" text-anchor="middle" opacity="1.0">04</text><text x="130.0" y="479.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start" opacity="1.0">汇报</text><text x="130.0" y="501.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">再写一段方向趋势</text><text x="650.0" y="483.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="end" opacity="1.0">20–30 min</text><circle cx="102" cy="563" r="15" fill="#F1F5F9"/><text x="102.0" y="568.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="10.5" font-weight="700" fill="#64748B" text-anchor="middle" opacity="1.0">05</text><text x="130.0" y="559.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start" opacity="1.0">复现</text><text x="130.0" y="581.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">搜索词和筛选理由通常没留下</text><text x="650.0" y="563.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="end" opacity="1.0">—</text><line x1="85" y1="620" x2="655" y2="620" stroke="#E2E8F0"/><text x="85.0" y="645.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="12" font-weight="700" fill="#DC2626" text-anchor="start" opacity="1.0">合计：2–3.5 小时；不可追溯、不可复现</text><rect x="740" y="130" width="700" height="520" rx="16" fill="#FFFFFF" stroke="#2563EB" stroke-opacity="0.25"/><text x="765.0" y="168.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="16" font-weight="700" fill="#2563EB" text-anchor="start" opacity="1.0">Sextant：一条链路交付</text><text x="765.0" y="192.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">输入主题，目录先可用；报告按需生成</text><circle cx="782" cy="253" r="15" fill="#EFF6FF"/><text x="782.0" y="258.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="10.5" font-weight="700" fill="#2563EB" text-anchor="middle" opacity="1.0">01</text><text x="810.0" y="249.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start" opacity="1.0">检索 + 去重</text><text x="810.0" y="271.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">4 个来源并行，DOI / 标题指纹去重</text><text x="1415.0" y="253.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="12" font-weight="700" fill="#2563EB" text-anchor="end" opacity="1.0">约 128 s</text><circle cx="782" cy="343" r="15" fill="#EFF6FF"/><text x="782.0" y="348.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="10.5" font-weight="700" fill="#2563EB" text-anchor="middle" opacity="1.0">02</text><text x="810.0" y="339.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start" opacity="1.0">可解释排序</text><text x="810.0" y="361.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">Top 20 带分数构成、来源、日期、摘要</text><text x="1415.0" y="343.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="12" font-weight="700" fill="#2563EB" text-anchor="end" opacity="1.0">即时</text><circle cx="782" cy="433" r="15" fill="#EFF6FF"/><text x="782.0" y="438.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="10.5" font-weight="700" fill="#2563EB" text-anchor="middle" opacity="1.0">03</text><text x="810.0" y="429.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start" opacity="1.0">按需报告</text><text x="810.0" y="451.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">六个分析小节 + 方法家族卡片</text><text x="1415.0" y="433.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="12" font-weight="700" fill="#2563EB" text-anchor="end" opacity="1.0">1–2 min</text><line x1="765" y1="520" x2="1415" y2="520" stroke="#E2E8F0"/><text x="765.0" y="548.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="12" font-weight="700" fill="#0D9488" text-anchor="start" opacity="1.0">合计：约 3–4 分钟；每一步都有产物和日志</text><text x="765.0" y="580.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">120 条原始 → 102 条去重 → Top 20 进入报告</text><text x="765.0" y="606.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">每条记录可点回来源；重跑留下新的 run_id</text><text x="765.0" y="632.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">报告卡片必须归属子方向，否则拒绝产出</text><rect x="60" y="690" width="320" height="90" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><text x="80.0" y="730.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="24" font-weight="700" fill="#2563EB" text-anchor="start" opacity="1.0">4</text><text x="80.0" y="756.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">来源</text><rect x="410" y="690" width="320" height="90" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><text x="430.0" y="730.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="24" font-weight="700" fill="#0D9488" text-anchor="start" opacity="1.0">120 → 102</text><text x="430.0" y="756.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">原始 → 去重</text><rect x="760" y="690" width="320" height="90" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><text x="780.0" y="730.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="24" font-weight="700" fill="#2563EB" text-anchor="start" opacity="1.0">Top 20</text><text x="780.0" y="756.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">进入报告</text><rect x="1110" y="690" width="320" height="90" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><text x="1130.0" y="730.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="24" font-weight="700" fill="#0D9488" text-anchor="start" opacity="1.0">100%</text><text x="1130.0" y="756.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">记录带来源</text><text x="60.0" y="825.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">人工耗时按每条摘要 40–60 秒估算；Sextant 的 128 秒包含检索、去重、中文增强和目录渲染。两者口径不同，只用于说明数量级差异。</text>
</svg>
