  <feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#0F172A" flood-opacity="0.07"/>
</filter>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
  <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.05"/>
</filter>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
</defs>
<rect width="1500" height="970" fill="#F5F7FB"/>
<text x="60.0" y="62.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="30" font-weight="700" fill="#0F172A" text-anchor="start" opacity="1.0">调研报告：独立任务时序</text><text x="60.0" y="92.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="14.5" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">报告由按钮触发；有自己的 run_id、日志和 SSE 流，失败不删除目录或旧报告</text><rect x="1324.6" y="42" width="115.39999999999999" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><circle cx="1339.6" cy="56" r="4.5" fill="#DC2626"/><text x="1351.6" y="60.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="600" fill="#64748B" text-anchor="start" opacity="1.0">失败 / 冲突</text><rect x="1260.1999999999998" y="42" width="54.4" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><circle cx="1275.1999999999998" cy="56" r="4.5" fill="#0D9488"/><text x="1287.2" y="60.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="600" fill="#64748B" text-anchor="start" opacity="1.0">事件</text><rect x="1195.7999999999997" y="42" width="54.4" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><circle cx="1210.7999999999997" cy="56" r="4.5" fill="#2563EB"/><text x="1222.8" y="60.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="600" fill="#64748B" text-anchor="start" opacity="1.0">调用</text><rect x="35" y="125" width="190" height="52" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#soft)"/><text x="130.0" y="157.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle" opacity="1.0">用户 / 浏览器</text><line x1="130" y1="177" x2="130" y2="870" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="335" y="125" width="190" height="52" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#soft)"/><text x="430.0" y="157.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle" opacity="1.0">API 路由</text><line x1="430" y1="177" x2="430" y2="870" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="615" y="125" width="190" height="52" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#soft)"/><text x="710.0" y="157.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#D97706" text-anchor="middle" opacity="1.0">JobRegistry</text><line x1="710" y1="177" x2="710" y2="870" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="895" y="125" width="190" height="52" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#soft)"/><text x="990.0" y="157.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#7C3AED" text-anchor="middle" opacity="1.0">报告任务</text><line x1="990" y1="177" x2="990" y2="870" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="1175" y="125" width="190" height="52" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#soft)"/><text x="1270.0" y="157.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#7C3AED" text-anchor="middle" opacity="1.0">LLM</text><line x1="1270" y1="177" x2="1270" y2="870" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="5 5"/><line x1="130" y1="210" x2="430" y2="210" stroke="#2563EB" stroke-width="2.0" stroke-linecap="round" marker-end="url(#arrow-blue)"/><text x="280.0" y="201.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="600" fill="#2563EB" text-anchor="middle" opacity="1.0">POST /topics/{id}/report</text><line x1="430" y1="262" x2="710" y2="262" stroke="#2563EB" stroke-width="2.0" stroke-linecap="round" marker-end="url(#arrow-blue)"/><text x="570.0" y="253.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="600" fill="#2563EB" text-anchor="middle" opacity="1.0">start_report(topic)</text><line x1="710" y1="314" x2="990" y2="314" stroke="#D97706" stroke-width="2.0" stroke-linecap="round" marker-end="url(#arrow-amber)"/><text x="850.0" y="305.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="600" fill="#D97706" text-anchor="middle" opacity="1.0">创建 job，分配 run_id</text><line x1="430" y1="366" x2="130" y2="366" stroke="#2563EB" stroke-width="2.0" stroke-linecap="round" marker-end="url(#arrow-blue)"/><text x="280.0" y="357.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="600" fill="#2563EB" text-anchor="middle" opacity="1.0">202 {job: running}</text><text x="280.0" y="385.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="10.5" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0">返回</text><line x1="990" y1="418" x2="1270" y2="418" stroke="#7C3AED" stroke-width="2.0" stroke-linecap="round" marker-end="url(#arrow-purple)"/><text x="1130.0" y="409.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="600" fill="#7C3AED" text-anchor="middle" opacity="1.0">分析 20 篇（4 批 × 5）</text><line x1="1270" y1="470" x2="990" y2="470" stroke="#7C3AED" stroke-width="2.0" stroke-linecap="round" marker-end="url(#arrow-purple)"/><text x="1130.0" y="461.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="600" fill="#7C3AED" text-anchor="middle" opacity="1.0">impacts JSON</text><line x1="990" y1="522" x2="1270" y2="522" stroke="#7C3AED" stroke-width="2.0" stroke-linecap="round" marker-end="url(#arrow-purple)"/><text x="1130.0" y="513.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="600" fill="#7C3AED" text-anchor="middle" opacity="1.0">综合写作（max_tokens 16000）</text><line x1="1270" y1="574" x2="990" y2="574" stroke="#7C3AED" stroke-width="2.0" stroke-linecap="round" marker-end="url(#arrow-purple)"/><text x="1130.0" y="565.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="600" fill="#7C3AED" text-anchor="middle" opacity="1.0">sections + cards</text><line x1="990" y1="626" x2="430" y2="626" stroke="#0D9488" stroke-width="2.0" stroke-linecap="round" marker-end="url(#arrow-teal)"/><text x="710.0" y="617.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="600" fill="#0D9488" text-anchor="middle" opacity="1.0">report/completed</text><text x="710.0" y="645.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="10.5" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0">写日志</text><line x1="430" y1="678" x2="130" y2="678" stroke="#0D9488" stroke-width="2.0" stroke-linecap="round" marker-end="url(#arrow-teal)"/><text x="280.0" y="669.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="600" fill="#0D9488" text-anchor="middle" opacity="1.0">SSE: report/running → completed</text><text x="280.0" y="697.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="10.5" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0">推送</text><line x1="990" y1="730" x2="430" y2="730" stroke="#0D9488" stroke-width="2.0" stroke-linecap="round" marker-end="url(#arrow-teal)"/><text x="710.0" y="721.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="600" fill="#0D9488" text-anchor="middle" opacity="1.0">run/completed</text><text x="710.0" y="749.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="10.5" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0">结束</text><rect x="450" y="760" width="520" height="115" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-opacity="0.35"/><text x="470.0" y="788.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="700" fill="#DC2626" text-anchor="start" opacity="1.0">冲突：同一主题已有检索 / 报告任务</text><text x="470.0" y="813.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">→ 409，提示「已有运行中的任务」</text><text x="470.0" y="838.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="700" fill="#DC2626" text-anchor="start" opacity="1.0">失败：未配置模型 / 目录不存在 / 文献不足</text><text x="470.0" y="863.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">→ 4xx 或 report/warning；旧报告保留</text><path d="M 710 314 L 710 755" fill="none" stroke="#DC2626" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-red)" stroke-dasharray="5 5"/><path d="M 990 626 L 990 755" fill="none" stroke="#DC2626" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-red)" stroke-dasharray="5 5"/><rect x="967.0" y="687" width="46.0" height="26" rx="13" fill="#F5F7FB" stroke="#CBD5E1"/><text x="990.0" y="704.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11" font-weight="600" fill="#DC2626" text-anchor="middle" opacity="1.0">失败</text><text x="60.0" y="930.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">截图口径：报告任务不会出现在主题的 runs.json 中；GET /api/topics/{id} 返回 active_report 供控制台恢复进度。</text>
</svg>
