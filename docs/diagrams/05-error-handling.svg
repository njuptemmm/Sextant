<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="960" viewBox="0 0 1500 960" role="img">
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
  <feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#0F172A" flood-opacity="0.07"/>
</filter>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
  <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.05"/>
</filter>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
</defs>
<rect width="1500" height="960" fill="#F5F7FB"/>
<text x="60.0" y="62.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="30" font-weight="700" fill="#0F172A" text-anchor="start" opacity="1.0">异常处理：失败域与降级路径</text><text x="60.0" y="92.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="14.5" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">失败局部化、可解释、可恢复；任何外部依赖出问题，用户都不会只看到「出错了」</text><rect x="1312.4" y="42" width="127.6" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><circle cx="1327.4" cy="56" r="4.5" fill="#DC2626"/><text x="1339.4" y="60.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="600" fill="#64748B" text-anchor="start" opacity="1.0">终止 / 4xx</text><rect x="1187.0" y="42" width="115.39999999999999" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><circle cx="1202.0" cy="56" r="4.5" fill="#D97706"/><text x="1214.0" y="60.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="600" fill="#64748B" text-anchor="start" opacity="1.0">降级 / 告警</text><rect x="1122.6" y="42" width="54.4" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><circle cx="1137.6" cy="56" r="4.5" fill="#0D9488"/><text x="1149.6" y="60.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="600" fill="#64748B" text-anchor="start" opacity="1.0">继续</text><rect x="60" y="130" width="360" height="44" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><text x="76.0" y="158.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="start" opacity="1.0">触发</text><rect x="450" y="130" width="640" height="44" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><text x="466.0" y="158.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="start" opacity="1.0">系统处理</text><rect x="1120" y="130" width="320" height="44" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><text x="1136.0" y="158.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="start" opacity="1.0">用户看到</text><rect x="60" y="190" width="1380" height="100" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="60" y="190" width="6" height="100" rx="3" fill="#DC2626"/><text x="82.0" y="220.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="14" font-weight="700" fill="#DC2626" text-anchor="start" opacity="1.0">请求级</text><text x="82.0" y="246.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">参数非法、主题重复、路径越界</text><text x="450.0" y="232.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="400" fill="#0F172A" text-anchor="start" opacity="1.0">立即返回 4xx，不启动任务；路径 resolve 后校验父目录</text><rect x="1120" y="208" width="300" height="64" rx="10" fill="#FEF2F2"/><text x="1140.0" y="234.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="600" fill="#DC2626" text-anchor="start" opacity="1.0">明确错误码 + 字段</text><rect x="60" y="298" width="1380" height="100" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="60" y="298" width="6" height="100" rx="3" fill="#D97706"/><text x="82.0" y="328.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="14" font-weight="700" fill="#D97706" text-anchor="start" opacity="1.0">来源级</text><text x="82.0" y="354.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">单个学术源超时 / 限流 / 解析失败</text><text x="450.0" y="340.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="400" fill="#0F172A" text-anchor="start" opacity="1.0">该源记 warning，其余来源继续；全失败才终止</text><rect x="1120" y="316" width="300" height="64" rx="10" fill="#FFFBEB"/><text x="1140.0" y="342.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="600" fill="#D97706" text-anchor="start" opacity="1.0">目录仍生成，标注失败来源</text><rect x="60" y="406" width="1380" height="100" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="60" y="406" width="6" height="100" rx="3" fill="#D97706"/><text x="82.0" y="436.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="14" font-weight="700" fill="#D97706" text-anchor="start" opacity="1.0">查询级</text><text x="82.0" y="462.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">同源内某条检索式失败</text><text x="450.0" y="448.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="400" fill="#0F172A" text-anchor="start" opacity="1.0">记录后继续下一条，不影响同源其他查询</text><rect x="1120" y="424" width="300" height="64" rx="10" fill="#FFFBEB"/><text x="1140.0" y="450.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="600" fill="#D97706" text-anchor="start" opacity="1.0">日志中可见失败检索式</text><rect x="60" y="514" width="1380" height="100" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="60" y="514" width="6" height="100" rx="3" fill="#D97706"/><text x="82.0" y="544.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="14" font-weight="700" fill="#D97706" text-anchor="start" opacity="1.0">模型级</text><text x="82.0" y="570.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">超时、非法 JSON、字段缺失、截断</text><text x="450.0" y="556.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="400" fill="#0F172A" text-anchor="start" opacity="1.0">单批失败只丢该批（10 条）；截断拆批；全部失败退回规则模式</text><rect x="1120" y="532" width="300" height="64" rx="10" fill="#FFFBEB"/><text x="1140.0" y="558.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="600" fill="#D97706" text-anchor="start" opacity="1.0">目录保留英文原文，不阻断</text><rect x="60" y="622" width="1380" height="100" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="60" y="622" width="6" height="100" rx="3" fill="#DC2626"/><text x="82.0" y="652.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="14" font-weight="700" fill="#DC2626" text-anchor="start" opacity="1.0">报告级</text><text x="82.0" y="678.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">未配置模型 / 文献不足 / 综合截断</text><text x="450.0" y="664.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="400" fill="#0F172A" text-anchor="start" opacity="1.0">入口 4xx；截断时预算翻倍（16k→32k→64k），到顶按方法家族归组</text><rect x="1120" y="640" width="300" height="64" rx="10" fill="#FEF2F2"/><text x="1140.0" y="666.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="600" fill="#DC2626" text-anchor="start" opacity="1.0">warning + notes；旧报告保留</text><text x="450.0" y="692.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">失败时保留旧报告；不会删除目录或 runs.json</text><rect x="60" y="730" width="1380" height="100" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="60" y="730" width="6" height="100" rx="3" fill="#D97706"/><text x="82.0" y="760.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="14" font-weight="700" fill="#D97706" text-anchor="start" opacity="1.0">渲染级</text><text x="82.0" y="786.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">中文质量门控不通过</text><text x="450.0" y="772.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="400" fill="#0F172A" text-anchor="start" opacity="1.0">降级渲染并告警，不用占位符冒充中文</text><rect x="1120" y="748" width="300" height="64" rx="10" fill="#FFFBEB"/><text x="1140.0" y="774.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="600" fill="#D97706" text-anchor="start" opacity="1.0">目录可用，标注降级</text><rect x="60" y="850" width="1380" height="80" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><text x="85.0" y="880.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#2563EB" text-anchor="start" opacity="1.0">状态恢复</text><text x="85.0" y="906.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">每个阶段只依赖工作区文件，可独立重入 · 控制台重跑重新执行整条链路 · 进程重启后已完成产物仍在 · 失败后先看日志再重跑</text>
</svg>
