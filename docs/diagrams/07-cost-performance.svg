<text x="60.0" y="62.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="30" font-weight="700" fill="#0F172A" text-anchor="start" opacity="1.0">成本与性能：实测数据</text><text x="60.0" y="92.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="14.5" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">无模型时 1–2 秒；开启中文增强约 128 秒；报告是独立的 1–2 分钟任务</text><rect x="1385.6" y="42" width="54.4" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><circle cx="1400.6" cy="56" r="4.5" fill="#0D9488"/><text x="1412.6" y="60.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="600" fill="#64748B" text-anchor="start" opacity="1.0">成本</text><rect x="1260.1999999999998" y="42" width="115.39999999999999" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><circle cx="1275.1999999999998" cy="56" r="4.5" fill="#D97706"/><text x="1287.2" y="60.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="600" fill="#64748B" text-anchor="start" opacity="1.0">增强 / 报告</text><rect x="1195.7999999999997" y="42" width="54.4" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><circle cx="1210.7999999999997" cy="56" r="4.5" fill="#2563EB"/><text x="1222.8" y="60.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="600" fill="#64748B" text-anchor="start" opacity="1.0">检索</text><rect x="60" y="130" width="650" height="330" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/><text x="85.0" y="165.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start" opacity="1.0">一次检索链路的耗时构成</text><text x="85.0" y="188.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">主题 Agent Memory Systems Acceptance · 4 个来源 · 含中文增强</text><rect x="90" y="220" width="27.25920125293657" height="42" fill="#2563EB"/><rect x="117.25920125293658" y="220" width="54.51840250587314" height="42" fill="#60A5FA"/><text x="144.5" y="247.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0">12s</text><rect x="171.77760375880973" y="220" width="507.2983555207517" height="42" fill="#D97706"/><text x="425.4" y="247.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0">110s</text><rect x="679.0759592795614" y="220" width="0.9240407204385278" height="42" fill="#94A3B8"/><text x="90.0" y="285.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">enrich 占 86%：40 条记录、4 批串行调用；检索本身只占 9%</text><line x1="90" y1="330" x2="680" y2="330" stroke="#E2E8F0"/><text x="90.0" y="360.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="700" fill="#64748B" text-anchor="start" opacity="1.0">无模型对照</text><rect x="190" y="345" width="8" height="22" fill="#0D9488"/><text x="210.0" y="362.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="400" fill="#0F172A" text-anchor="start" opacity="1.0">1.2 s（每源 5 条，17 条去重后）</text><text x="90.0" y="400.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="700" fill="#64748B" text-anchor="start" opacity="1.0">有模型</text><rect x="190" y="385" width="128" height="22" fill="#D97706"/><text x="326.0" y="402.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="400" fill="#0F172A" text-anchor="start" opacity="1.0">127.7 s（120 条 → 102 条）</text><text x="90.0" y="435.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">结论：等待主要来自模型增强，而不是检索；报告不在这条链路里。</text><rect x="740" y="130" width="700" height="330" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/><text x="765.0" y="165.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start" opacity="1.0">报告任务的时间线（Top 20）</text><text x="765.0" y="188.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">run 20261024T174151-2e2f57 · deepseek-flash · 总计 134.6 秒</text><rect x="765" y="225" width="152.16417910447763" height="48" rx="6" fill="#7C3AED"/><text x="841.1" y="254.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0">33s</text><text x="841.1" y="295.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="10.5" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0">分析 1–5</text><rect x="919.1641791044776" y="225" width="82.08955223880596" height="48" rx="6" fill="#7C3AED"/><text x="960.2" y="254.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0">18s</text><text x="960.2" y="295.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="10.5" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0">分析 6–10</text><rect x="1003.2537313432836" y="225" width="77.41791044776119" height="48" rx="6" fill="#7C3AED"/><text x="1042.0" y="254.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0">17s</text><text x="1042.0" y="295.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="10.5" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0">分析 11–15</text><rect x="1082.6716417910447" y="225" width="96.1044776119403" height="48" rx="6" fill="#7C3AED"/><text x="1130.7" y="254.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0">21s</text><text x="1130.7" y="295.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="10.5" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0">分析 16–20</text><rect x="1180.776119402985" y="225" width="208.22388059701493" height="48" rx="6" fill="#D97706"/><text x="1284.9" y="254.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0">45s</text><text x="1284.9" y="295.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="10.5" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0">综合写作</text><rect x="1390.9999999999998" y="225" width="22" height="48" rx="6" fill="#0D9488"/><text x="1402.0" y="254.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0">1s</text><text x="1413.0" y="295.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="10.5" font-weight="400" fill="#64748B" text-anchor="end" opacity="1.0">渲染</text><text x="765.0" y="340.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">4 次分析 + 1 次综合；分析批次失败只丢该批，综合截断时预算翻倍重试。</text><text x="765.0" y="390.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="600" fill="#0D9488" text-anchor="start" opacity="1.0">报告独立运行，目录在等待期间始终可访问。</text><text x="765.0" y="420.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">实测 80–135 秒，随主题与模型输出长度浮动。</text><rect x="60" y="490" width="680" height="300" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/><text x="85.0" y="525.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start" opacity="1.0">成本（人民币）</text><text x="85.0" y="548.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">按输入 1 元/百万 token、输出 2 元/百万 token 估算</text><circle cx="95" cy="580" r="5" fill="#0D9488"/><text x="112.0" y="585.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="12" font-weight="600" fill="#0F172A" text-anchor="start" opacity="1.0">学术 API</text><text x="330.0" y="585.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#0D9488" text-anchor="start" opacity="1.0">¥0</text><text x="470.0" y="585.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">全部免费</text><circle cx="95" cy="628" r="5" fill="#2563EB"/><text x="112.0" y="633.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="12" font-weight="600" fill="#0F172A" text-anchor="start" opacity="1.0">中文增强</text><text x="330.0" y="633.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#2563EB" text-anchor="start" opacity="1.0">≈ ¥0.04</text><text x="470.0" y="633.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">40 条上限 / 次</text><circle cx="95" cy="676" r="5" fill="#D97706"/><text x="112.0" y="681.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="12" font-weight="600" fill="#0F172A" text-anchor="start" opacity="1.0">调研报告</text><text x="330.0" y="681.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#D97706" text-anchor="start" opacity="1.0">≈ ¥0.05–0.1</text><text x="470.0" y="681.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">20 篇 / 份</text><circle cx="95" cy="724" r="5" fill="#7C3AED"/><text x="112.0" y="729.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="12" font-weight="600" fill="#0F172A" text-anchor="start" opacity="1.0">一次演示</text><text x="330.0" y="729.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#7C3AED" text-anchor="start" opacity="1.0">&lt; ¥0.5</text><text x="470.0" y="729.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">3–5 次运行</text><rect x="770" y="490" width="670" height="300" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/><text x="795.0" y="525.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start" opacity="1.0">资源占用（实测）</text><text x="795.0" y="575.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">API 常驻内存</text><text x="1415.0" y="575.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="end" opacity="1.0">54–61 MB</text><line x1="795" y1="589" x2="1415" y2="589" stroke="#E2E8F0"/><text x="795.0" y="627.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">/api/health 热延迟</text><text x="1415.0" y="627.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="end" opacity="1.0">2–4 ms</text><line x1="795" y1="641" x2="1415" y2="641" stroke="#E2E8F0"/><text x="795.0" y="679.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">单主题工作区</text><text x="1415.0" y="679.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="end" opacity="1.0">855 KB / 59 条</text><line x1="795" y1="693" x2="1415" y2="693" stroke="#E2E8F0"/><text x="795.0" y="731.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">catalog.html</text><text x="1415.0" y="731.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="end" opacity="1.0">303 KB 自包含</text><line x1="795" y1="745" x2="1415" y2="745" stroke="#E2E8F0"/><text x="795.0" y="780.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">单核即可运行；外部 API 全部免费，现金成本来自可选的模型调用。</text><text x="60.0" y="830.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start" opacity="1.0">口径：Sextant 数字来自 run_summary.json 与运行日志；人工耗时估算见场景价值文档。</text>
