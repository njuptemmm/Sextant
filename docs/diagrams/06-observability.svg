25" x2="1190" y2="425" stroke="#0D9488" stroke-width="2.0" stroke-linecap="round" marker-end="url(#arrow-teal)"/><line x1="1315" y1="470" x2="1315" y2="500" stroke="#7C3AED" stroke-width="2.0" stroke-linecap="round" marker-end="url(#arrow-purple)"/><rect x="60" y="600" width="1380" height="190" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/><text x="85.0" y="632.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start" opacity="1.0">一次真实运行的事件带（run 20261024T173630-b15ef5）</text><line x1="90" y1="700" x2="1378" y2="700" stroke="#CBD5E1" stroke-width="2"/><circle cx="90" cy="700" r="7" fill="#2563EB"/><text x="90.0" y="682.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11" font-weight="600" fill="#2563EB" text-anchor="middle" opacity="1.0">run/started</text><text x="90.0" y="728.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0">0.0 s</text><circle cx="274" cy="700" r="7" fill="#2563EB"/><text x="274.0" y="682.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11" font-weight="600" fill="#2563EB" text-anchor="middle" opacity="1.0">plan</text><text x="274.0" y="728.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11" font-weight="400" fill="#64748B" text-anchor="middle" opacity="1.0">5.9 s</text><circle cx="458" cy="700" r="7" fill="#2563EB"/><text x="458.0" y="682.0" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="11" font-weight="600" fill="#2563EB" text-anchor="middle" opacity="1.0">retrieve</text><text x="458.0" y="728.0" font-family="&quot;Microsoft YaHei&quot;, 