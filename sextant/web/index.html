<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sextant · 研究情报追踪</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --ink:#101828; --muted:#667085; --line:#e4e7ec;
    --accent:#1d4ed8; --accent-soft:#eef2ff; --ok:#067647; --ok-soft:#ecfdf3;
    --warn:#b54708; --warn-soft:#fffaeb; --bad:#b42318; --bad-soft:#fef3f2;
    --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.1);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}
  button{font:inherit}
  .shell{max-width:1360px;margin:0 auto;padding:20px 24px 48px}
  header.top{display:flex;align-items:center;gap:16px;padding:8px 0 20px}
  .brand{display:flex;align-items:center;gap:12px}
  .mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,#1d4ed8,#0b2a7a);
    display:grid;place-items:center;color:#fff;font-weight:700;font-size:19px;letter-spacing:-.5px}
  .brand h1{margin:0;font-size:19px;letter-spacing:-.2px}
  .brand p{margin:0;color:var(--muted);font-size:12.5px}
  .badges{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);
    border-radius:999px;background:var(--panel);font-size:12px;color:var(--muted)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
  .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
  .grid{display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px;align-items:start}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
  .panel-head h2{margin:0;font-size:14px;font-weight:650}
  .panel-body{padding:16px}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
  .field input,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;
    background:#fff;color:var(--ink);font:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
  .field input:focus,.field textarea:focus{border-color:#93b4ff;box-shadow:0 0 0 3px rgba(29,78,216,.1)}
  .field textarea{resize:vertical;min-height:64px}
  .hint{font-size:12px;color:var(--muted);margin-top:4px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border-radius:9px;
    border:1px solid transparent;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;transition:.15s}
  .btn:hover{background:#1a45c0}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--ink);font-weight:550}
  .btn.ghost:hover{background:#f9fafb}
  .btn.wide{width:100%}
  .topic-list{display:flex;flex-direction:column;gap:2px;max-height:420px;overflow:auto}
  .topic{display:block;width:100%;text-align:left;padding:11px 16px;border:0;background:transparent;
    border-left:3px solid transparent;cursor:pointer}
  .topic:hover{background:#f9fafb}
  .topic.active{background:var(--accent-soft);border-left-color:var(--accent)}
  .topic .t-name{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px}
  .topic .t-meta{font-size:12px;color:var(--muted);margin-top:2px}
  .tag{font-size:11px;padding:1px 7px;border-radius:999px;background:#f2f4f7;color:var(--muted);font-weight:500}
  .tag.running{background:var(--accent-soft);color:var(--accent)}
  .tag.done{background:var(--ok-soft);color:var(--ok)}
  .tag.failed{background:var(--bad-soft);color:var(--bad)}
  .empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:13px}
  .work{padding:18px 20px 22px}
  .work-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:16px}
  .work-head h2{margin:0 0 3px;font-size:17px;letter-spacing:-.2px}
  .work-head p{margin:0;color:var(--muted);font-size:12.5px}
  .work-actions{margin-left:auto;display:flex;gap:8px}
  .stages{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:16px}
  .stage{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;min-width:0}
  .stage .s-name{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .stage .s-state{font-size:12.5px;font-weight:600;margin-top:3px}
  .stage.running{border-color:#93b4ff;background:var(--accent-soft)}
  .stage.running .s-state{color:var(--accent)}
  .stage.done{border-color:#a6f4c5;background:var(--ok-soft)}
  .stage.done .s-state{color:var(--ok)}
  .stage.warning{border-color:#fedf89;background:var(--warn-soft)}
  .stage.warning .s-state{color:var(--warn)}
  .stage.failed{border-color:#fecdca;background:var(--bad-soft)}
  .stage.failed .s-state{color:var(--bad)}
  .sysline{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fbfcfd;
    margin-bottom:16px;font-size:12.5px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}
  .sysline strong{color:var(--ink);font-weight:600}
  .alert{display:none;border:1px solid #fecdca;background:var(--bad-soft);color:#7a271a;border-radius:10px;
    padding:11px 13px;margin-bottom:14px;font-size:13px}
  .alert.show{display:block}
  .alert .hint{margin-top:4px;color:#912018}
  .logbox{border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .logbox .lb-head{display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid var(--line);
    background:#fbfcfd;font-size:12.5px;color:var(--muted)}
  .logbox .lb-head .spacer{margin-left:auto}
  .log{max-height:420px;overflow:auto;padding:8px 4px 14px;font-size:12.5px}
  .ev{display:grid;grid-template-columns:70px 92px minmax(0,1fr) 64px;gap:10px;padding:6px 13px;
    border-bottom:1px dashed #eef0f3;align-items:baseline}
  .ev:last-child{border-bottom:0}
  .ev .time{color:#98a2b3;font-variant-numeric:tabular-nums}
  .ev .st{font-weight:600;font-size:12px}
  .ev .msg{color:#344054;word-break:break-word}
  .ev .dur{text-align:right;color:#98a2b3;font-variant-numeric:tabular-nums}
  .ev.warning .st{color:var(--warn)}
  .ev.failed .st,.ev.failed .msg{color:var(--bad)}
  .ev.completed .st{color:var(--ok)}
  .ev.running .st{color:var(--accent)}
  .catalog-card{display:none;margin-top:16px;border:1px solid #a6f4c5;background:var(--ok-soft);
    border-radius:10px;padding:14px 16px;align-items:center;gap:14px}
  .catalog-card.show{display:flex}
  .catalog-card .cc-text{font-size:13px;color:#05603a}
  .catalog-card .cc-text strong{display:block;color:#054f31;font-size:14px}
  .catalog-card .btn{margin-left:auto;background:var(--ok)}
  .catalog-card .btn:hover{background:#05603a}
  @media (max-width:1040px){
    .grid{grid-template-columns:1fr}
    .stages{grid-template-columns:repeat(3,1fr)}
  }
  @media (max-width:640px){
    .shell{padding:12px}
    .row{grid-template-columns:1fr}
    .stages{grid-template-columns:repeat(2,1fr)}
    .ev{grid-template-columns:60px minmax(0,1fr)}
    .ev .st,.ev .dur{display:none}
  }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">
      <div class="mark">S</div>
      <div>
        <h1>Sextant · 六分仪</h1>
        <p>多源学术检索 · 证据排序 · 可追溯目录</p>
      </div>
    </div>
    <div class="badges">
      <span class="badge"><span class="dot" id="healthDot"></span><span id="healthText">检查服务中…</span></span>
      <span class="badge" id="llmBadge">模型：—</span>
      <span class="badge" id="versionBadge">v—</span>
    </div>
  </header>

  <div class="grid">
    <div>
      <section class="panel">
        <div class="panel-head"><h2>新建追踪主题</h2></div>
        <div class="panel-body">
          <form id="createForm">
            <div class="field">
              <label for="name">研究主题</label>
              <input id="name" name="name" required maxlength="120" placeholder="例如：LLM agent evaluation">
            </div>
            <div class="field">
              <label for="keywords">关键词（逗号分隔，留空则用主题名）</label>
              <input id="keywords" name="keywords" placeholder="LLM agent, evaluation, benchmark">
            </div>
            <div class="field">
              <label for="question">想回答的问题（可选）</label>
              <textarea id="question" name="question" placeholder="这个领域最近在用什么方法评测 agent？"></textarea>
            </div>
            <div class="row">
              <div class="field">
                <label for="from_date">起始日期</label>
                <input id="from_date" name="from_date" type="date">
              </div>
              <div class="field">
                <label for="to_date">截止日期</label>
                <input id="to_date" name="to_date" type="date">
              </div>
            </div>
            <div class="field">
              <label for="max_results">每个来源最多返回</label>
              <input id="max_results" name="max_results" type="number" min="1" max="50" value="20">
              <div class="hint">OpenAlex 与 arXiv 会并行检索，结果去重后统一排序。</div>
            </div>
            <button class="btn wide" id="createBtn" type="submit">开始检索</button>
          </form>
        </div>
      </section>

      <section class="panel" style="margin-top:18px">
        <div class="panel-head">
          <h2>主题</h2>
          <button class="btn ghost" id="refreshBtn" type="button" style="padding:5px 10px;font-size:12px">刷新</button>
        </div>
        <div class="topic-list" id="topicList">
          <div class="empty">还没有主题，先在左侧创建一个。</div>
        </div>
      </section>
    </div>

    <section class="panel">
      <div class="work" id="work">
        <div class="work-head">
          <div>
            <h2 id="workTitle">运行时间线</h2>
            <p id="workSub">选择一个主题查看执行过程，或新建主题开始第一次检索。</p>
          </div>
          <div class="work-actions">
            <button class="btn ghost" id="openCatalogBtn" type="button" disabled>打开目录</button>
            <button class="btn ghost" id="rerunBtn" type="button" disabled>重跑</button>
          </div>
        </div>

        <div class="sysline" id="sysline">
          <span>状态 <strong id="sysStatus">空闲</strong></span>
          <span>记录 <strong id="sysRecords">0</strong></span>
          <span>耗时 <strong id="sysDuration">—</strong></span>
          <span>运行 ID <strong id="sysRun">—</strong></span>
        </div>

        <div class="stages" id="stages"></div>

        <div class="alert" id="alert">
          <div id="alertText"></div>
          <div class="hint" id="alertHint"></div>
        </div>

        <div class="logbox">
          <div class="lb-head">
            <span>执行日志</span>
            <span class="spacer"></span>
            <span id="liveState">未连接</span>
          </div>
          <div class="log" id="log">
            <div class="empty">暂无事件。</div>
          </div>
        </div>

        <div class="catalog-card" id="catalogCard">
          <div class="cc-text">
            <strong>证据目录已生成</strong>
            <span id="catalogMeta">可直接打开查看筛选与中英摘要。</span>
          </div>
          <button class="btn" id="catalogLink" type="button">打开目录 →</button>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
const STAGES = [
  ["plan","查询规划"],
  ["retrieve","多源检索"],
  ["normalize","去重归一"],
  ["enrich","中文增强"],
  ["rank","相关性排序"],
  ["render","目录生成"],
];
const state = { topic:null, runId:null, source:null, finished:false };

const $ = (id) => document.getElementById(id);
const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (ch) => (
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]
));

function renderStages(map = {}){
  $("stages").innerHTML = STAGES.map(([key,label]) => {
    const info = map[key] || {};
    const cls = info.cls || "";
    const text = info.text || "等待";
    return `<div class="stage ${cls}"><div class="s-name">${label}</div><div class="s-state">${esc(text)}</div></div>`;
  }).join("");
}
renderStages();

function resetWork(topic){
  state.finished = false;
  closeStream();
  $("alert").classList.remove("show");
  $("catalogCard").classList.remove("show");
  $("log").innerHTML = '<div class="empty">正在等待事件…</div>';
  $("workTitle").textContent = topic ? topic.topic_name : "运行时间线";
  $("workSub").textContent = topic ? `主题 ID：${topic.topic_id}` : "选择一个主题查看执行过程。";
  $("sysRun").textContent = "—";
  $("sysDuration").textContent = "—";
  $("sysRecords").textContent = "0";
  $("sysStatus").textContent = "准备中";
  $("liveState").textContent = "未连接";
  renderStages();
}

function closeStream(){
  if (state.source){ state.source.close(); state.source = null; }
}

async function api(path, options){
  const response = await fetch(path, options);
  const text = await response.text();
  let body = null;
  try { body = text ? JSON.parse(text) : null; } catch { body = { detail: text }; }
  if (!response.ok){
    const message = body && body.detail ? body.detail : `HTTP ${response.status}`;
    throw new Error(message);
  }
  return body;
}

async function loadHealth(){
  try{
    const health = await api("/api/health");
    $("healthDot").className = "dot " + (health.workspace_writable ? "ok" : "bad");
    $("healthText").textContent = health.workspace_writable ? "服务正常" : "工作区不可写";
    $("llmBadge").textContent = health.llm_configured ? `模型：${health.llm_model}` : "模型：未配置（降级运行）";
    $("versionBadge").textContent = "v" + health.version;
  }catch(error){
    $("healthDot").className = "dot bad";
    $("healthText").textContent = "服务不可用";
  }
}

async function loadTopics(){
  try{
    const data = await api("/api/topics");
    const list = $("topicList");
    if (!data.topics.length){
      list.innerHTML = '<div class="empty">还没有主题，先在左侧创建一个。</div>';
      return;
    }
    list.innerHTML = data.topics.map((topic) => {
      const run = topic.last_run || {};
      const status = run.status || "idle";
      const tagClass = status === "completed" ? "done" : status === "failed" ? "failed" : status === "running" ? "running" : "";
      const tagText = status === "completed" ? "已完成" : status === "failed" ? "失败" : status === "running" ? "运行中" : "未运行";
      const active = state.topic && state.topic.topic_id === topic.topic_id ? " active" : "";
      return `<button class="topic${active}" data-topic="${esc(topic.topic_id)}">
        <div class="t-name">${esc(topic.topic_name)}<span class="tag ${tagClass}">${tagText}</span></div>
        <div class="t-meta">${topic.record_count} 条记录 · ${esc((topic.keywords||[]).join(" / ") || "无关键词")}</div>
      </button>`;
    }).join("");
    list.querySelectorAll(".topic").forEach((button) => {
      button.addEventListener("click", () => selectTopic(button.dataset.topic));
    });
  }catch(error){
    $("topicList").innerHTML = `<div class="empty">加载失败：${esc(error.message)}</div>`;
  }
}

async function selectTopic(topicId){
  try{
    const topic = await api(`/api/topics/${encodeURIComponent(topicId)}`);
    state.topic = topic;
    resetWork(topic);
    $("rerunBtn").disabled = false;
    $("openCatalogBtn").disabled = !topic.catalog_exists;
    $("sysRecords").textContent = topic.record_count ?? 0;

    const runs = topic.runs || [];
    const latest = runs[0];
    if (topic.active_job){
      state.runId = topic.active_job.run_id;
      $("sysStatus").textContent = "运行中";
      startStream(topic.topic_id, state.runId);
    } else if (latest){
      state.runId = latest.run_id;
      $("sysRun").textContent = latest.run_id;
      $("sysStatus").textContent = latest.status === "completed" ? "已完成" : latest.status === "failed" ? "失败" : latest.status;
      startStream(topic.topic_id, latest.run_id);
    } else {
      $("sysStatus").textContent = "未运行";
    }
    if (topic.catalog_exists){
      $("catalogCard").classList.add("show");
      $("catalogMeta").textContent = `${topic.record_count} 条记录，来源：${(topic.sources||[]).join("、") || "—"}`;
      $("catalogLink").onclick = () => window.open(`/api/topics/${encodeURIComponent(topic.topic_id)}/catalog`, "_blank");
      $("openCatalogBtn").onclick = $("catalogLink").onclick;
    }
    await loadTopics();
  }catch(error){
    showAlert(`读取主题失败：${error.message}`, "刷新页面或确认主题目录是否存在。");
  }
}

function showAlert(text, hint){
  $("alertText").textContent = text;
  $("alertHint").textContent = hint || "";
  $("alert").classList.add("show");
}

function upsertStage(stage, status, message){
  if (!STAGES.some(([key]) => key === stage)) return;
  const map = {};
  document.querySelectorAll("#stages .stage").forEach((node, index) => {
    const key = STAGES[index][0];
    const stateText = node.querySelector(".s-state").textContent;
    map[key] = { cls: node.className.replace("stage","").trim(), text: stateText };
  });
  if (status === "started") map[stage] = { cls: "running", text: "进行中" };
  else if (status === "completed") map[stage] = { cls: "done", text: message ? message.slice(0, 12) : "完成" };
  else if (status === "warning") map[stage] = { cls: "warning", text: "已降级" };
  else if (status === "skipped") map[stage] = { cls: "", text: "跳过" };
  else if (status === "failed") map[stage] = { cls: "failed", text: "失败" };
  renderStages(map);
}

function appendEvent(event){
  const log = $("log");
  if (log.querySelector(".empty")) log.innerHTML = "";
  const row = document.createElement("div");
  const status = event.status || "";
  row.className = "ev " + status;
  const time = String(event.ts || "").slice(11, 19);
  const dur = event.duration_ms != null ? `${event.duration_ms} ms` : "";
  row.innerHTML = `<span class="time">${esc(time)}</span>
    <span class="st">${esc(event.stage || "")}</span>
    <span class="msg">${esc(event.message || "")}</span>
    <span class="dur">${esc(dur)}</span>`;
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
}

function handleEvent(event){
  appendEvent(event);
  if (event.duration_ms != null) $("sysDuration").textContent = `${event.duration_ms} ms`;
  if (event.stage === "run" && event.status === "started"){
    $("sysRun").textContent = event.run_id || state.runId || "—";
    $("sysStatus").textContent = "运行中";
    $("liveState").textContent = "实时连接";
  }
  if (event.stage === "run" && event.status === "completed"){
    state.finished = true;
    $("sysStatus").textContent = "已完成";
    $("liveState").textContent = "已结束";
    const data = event.data || {};
    $("sysRecords").textContent = data.records ?? "—";
    $("catalogCard").classList.add("show");
    $("catalogMeta").textContent = `${data.records ?? 0} 条记录已写入目录`;
    const link = () => window.open(`/api/topics/${encodeURIComponent(state.topic.topic_id)}/catalog`, "_blank");
    $("catalogLink").onclick = link;
    $("openCatalogBtn").onclick = link;
    $("openCatalogBtn").disabled = false;
    closeStream();
    loadTopics();
  }
  if (event.stage === "run" && event.status === "failed"){
    state.finished = true;
    $("sysStatus").textContent = "失败";
    $("liveState").textContent = "已结束";
    const data = event.data || {};
    showAlert(event.message || "运行失败", data.hint || "查看执行日志定位失败阶段。");
    closeStream();
    loadTopics();
  }
  upsertStage(event.stage, event.status, event.message);
}

function startStream(topicId, runId){
  closeStream();
  $("liveState").textContent = "连接中…";
  const source = new EventSource(`/api/topics/${encodeURIComponent(topicId)}/events?run_id=${encodeURIComponent(runId)}`);
  state.source = source;
  source.onopen = () => { $("liveState").textContent = "实时连接"; };
  source.onmessage = (message) => {
    try { handleEvent(JSON.parse(message.data)); } catch (error) { /* ignore malformed frame */ }
  };
  source.onerror = () => {
    if (state.finished){ closeStream(); return; }
    $("liveState").textContent = "连接中断，浏览器会自动重连";
  };
}

$("createForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  const button = $("createBtn");
  button.disabled = true;
  button.textContent = "正在创建…";
  try{
    const payload = {
      name: $("name").value.trim(),
      keywords: $("keywords").value.split(/[,，;；]/).map((item) => item.trim()).filter(Boolean),
      question: $("question").value.trim(),
      from_date: $("from_date").value,
      to_date: $("to_date").value,
      max_results: Number($("max_results").value) || 20,
    };
    const data = await api("/api/topics", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payload),
    });
    state.topic = data.topic;
    state.runId = data.job.run_id;
    $("createForm").reset();
    $("max_results").value = 20;
    resetWork(data.topic);
    $("sysRun").textContent = data.job.run_id;
    $("sysStatus").textContent = "运行中";
    $("rerunBtn").disabled = false;
    startStream(data.topic.topic_id, data.job.run_id);
    await loadTopics();
  }catch(error){
    showAlert(`创建失败：${error.message}`, "主题名重复时请换一个名字，或直接选择已有主题重跑。");
  }finally{
    button.disabled = false;
    button.textContent = "开始检索";
  }
});

$("rerunBtn").addEventListener("click", async () => {
  if (!state.topic) return;
  $("rerunBtn").disabled = true;
  try{
    const data = await api(`/api/topics/${encodeURIComponent(state.topic.topic_id)}/rerun`, {method:"POST"});
    state.runId = data.job.run_id;
    resetWork(state.topic);
    $("sysRun").textContent = data.job.run_id;
    $("sysStatus").textContent = "运行中";
    startStream(state.topic.topic_id, data.job.run_id);
  }catch(error){
    showAlert(`重跑失败：${error.message}`, "当前主题可能已有运行中的任务，等它结束再试。");
  }finally{
    $("rerunBtn").disabled = false;
  }
});

$("refreshBtn").addEventListener("click", loadTopics);

loadHealth();
loadTopics();
</script>
</body>
</html>
