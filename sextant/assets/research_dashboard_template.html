<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{DOCUMENT_TITLE}}</title>
  <style>
    :root {
      --ink: #18232e;
      --muted: #65717e;
      --line: #d7dee5;
      --panel: #ffffff;
      --canvas: #edf1f4;
      --navy: #17324d;
      --blue: #2b6789;
      --teal: #147873;
      --green: #2b7d5c;
      --amber: #ad681d;
      --red: #aa4942;
      --soft-blue: #e8f0f5;
      --soft-teal: #e5f2ef;
      --soft-green: #e7f2eb;
      --soft-amber: #f8efe2;
      --soft-red: #f7e9e7;
      --shadow: 0 8px 26px rgba(23, 50, 77, .08);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(43,103,137,.05) 0, transparent 28%),
        linear-gradient(315deg, rgba(20,120,115,.05) 0, transparent 24%),
        var(--canvas);
      font-family: "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1.48;
    }
    a { color: inherit; }
    button, input, select { font: inherit; }
    .page { max-width: 1180px; margin: 0 auto; padding: 14px 18px 42px; }
    .report-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: end;
      padding: 28px 32px;
      color: #fff;
      background: linear-gradient(118deg, #142d46 0%, #194762 72%, #176862 100%);
      border-radius: 10px;
      border-bottom: 5px solid #d6a34a;
      box-shadow: var(--shadow);
    }
    .eyebrow { color: #9bd8cf; font-size: 12px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    .report-head h1 { margin: 5px 0 0; font-family: Georgia, "Noto Serif SC", serif; font-size: clamp(26px, 3vw, 37px); line-height: 1.24; }
    .subtitle { max-width: 980px; margin-top: 9px; color: #d7e3ea; font-size: 15px; }
    .head-side { min-width: 170px; text-align: right; color: #d7e3ea; font-size: 12px; }
    .print-btn { margin-top: 10px; padding: 7px 13px; color: #fff; background: transparent; border: 1px solid rgba(255,255,255,.45); border-radius: 5px; cursor: pointer; }
    .print-btn:hover { background: rgba(255,255,255,.1); }
    .section-nav {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      gap: 5px;
      overflow-x: auto;
      margin-top: 12px;
      padding: 8px;
      background: rgba(255,255,255,.96);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 3px 12px rgba(20,35,50,.06);
    }
    .section-nav a { flex: 0 0 auto; padding: 7px 11px; color: #314557; text-decoration: none; border-radius: 5px; font-size: 12px; font-weight: 700; }
    .section-nav a:hover { color: var(--navy); background: var(--soft-blue); }
    section { margin-top: 16px; scroll-margin-top: 66px; }
    .section-title { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin-bottom: 9px; padding-bottom: 7px; border-bottom: 2px solid #b9c6d1; }
    .section-title h2 { margin: 0; color: var(--navy); font-family: Georgia, "Noto Serif SC", serif; font-size: 22px; line-height: 1.3; }
    .section-note { color: var(--muted); font-size: 12px; }
    .kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .kpi { min-height: 112px; padding: 18px 20px; background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--blue); border-radius: 8px; }
    .kpi.teal { border-top-color: var(--teal); }
    .kpi.green { border-top-color: var(--green); }
    .kpi.amber { border-top-color: var(--amber); }
    .kpi strong { display: block; color: var(--navy); font-size: 30px; line-height: 1; }
    .kpi span { display: block; margin-top: 10px; font-weight: 700; }
    .kpi small { display: block; margin-top: 4px; color: var(--muted); }
    .panel { padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 3px 12px rgba(23,50,77,.035); }
    .toolbar { display: grid; grid-template-columns: minmax(220px, 1.5fr) repeat(3, minmax(130px, .55fr)); gap: 10px; }
    .toolbar input, .toolbar select { width: 100%; padding: 10px 11px; color: #2a3947; background: #fbfcfd; border: 1px solid #cbd5de; border-radius: 6px; outline: none; }
    .toolbar input:focus, .toolbar select:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(43,103,137,.12); }
    .result-line { display: flex; justify-content: space-between; gap: 12px; margin-top: 11px; color: var(--muted); font-size: 12px; }
    .bars { display: grid; gap: 9px; margin-top: 14px; }
    .bar-row { display: grid; grid-template-columns: 150px minmax(0, 1fr) 45px; gap: 10px; align-items: center; }
    .bar-label { overflow: hidden; color: #3b4c5c; font-size: 12px; font-weight: 700; text-align: right; text-overflow: ellipsis; white-space: nowrap; }
    .bar-track { height: 14px; overflow: hidden; background: #e7ecf0; border-radius: 3px; }
    .bar-fill { height: 100%; background: linear-gradient(90deg, var(--blue), var(--teal)); border-radius: 3px; }
    .paper-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
    .paper-list { display: grid; grid-template-columns: 1fr; gap: 7px; }
    .paper-card { position: relative; min-width: 0; overflow: hidden; background: var(--panel); border: 1px solid var(--line); border-top: 5px solid var(--teal); border-radius: 8px; box-shadow: 0 4px 18px rgba(23,50,77,.045); }
    .paper-card[data-basis="abstract_fallback"] { border-top-color: var(--amber); }
    .paper-card[data-basis="unavailable"] { border-top-color: var(--red); }
    .paper-head { padding: 17px 20px 14px; border-bottom: 1px solid #e4e9ed; }
    .paper-kicker { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .rank { color: var(--teal); font-size: 12px; font-weight: 900; letter-spacing: .08em; }
    .tag { display: inline-flex; min-height: 22px; align-items: center; padding: 2px 7px; color: #315064; background: var(--soft-blue); border-radius: 4px; font-size: 10px; font-weight: 800; }
    .tag.source { color: #fff; background: var(--blue); }
    .tag.full { color: #176346; background: var(--soft-green); }
    .tag.partial { color: #90520f; background: var(--soft-amber); }
    .tag.failed { color: #8b3e38; background: var(--soft-red); }
    .paper-head h3 { margin: 8px 0 6px; font-family: Georgia, "Noto Serif SC", serif; font-size: 18px; line-height: 1.42; overflow-wrap: anywhere; }
    .paper-head h3 a { color: var(--navy); text-decoration: none; }
    .paper-head h3 a:hover { color: var(--blue); text-decoration: underline; }
    .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 11px; }
    .paper-body { padding: 16px 20px 19px; }
    .paper-body > p { margin: 0; color: #394957; }
    .field { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 13px; padding: 11px 0; border-top: 1px solid #e8ecef; }
    .field:first-child { padding-top: 0; border-top: 0; }
    .field-label { color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .02em; }
    .field-value { margin: 0; color: #344454; white-space: pre-wrap; }
    .compact .field { grid-template-columns: 105px minmax(0, 1fr); }
    .summary-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
    .summary-stack { display: grid; grid-template-columns: 1fr; gap: 8px; }
    .summary-card { padding: 13px 15px; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--blue); border-radius: 6px; }
    .summary-card.wide { grid-column: 1 / -1; }
    .summary-card h3 { margin: 0 0 9px; color: var(--navy); font-family: Georgia, "Noto Serif SC", serif; font-size: 18px; }
    .summary-card p { margin: 0; white-space: pre-wrap; }
    .theme { padding: 12px; background: rgba(255,255,255,.58); border: 1px solid #cbd5dc; border-radius: 7px; }
    .theme + .theme { margin-top: 10px; }
    .theme-head { margin-bottom: 8px; padding: 0 2px 8px; border-bottom: 1px solid #c8d2db; }
    .theme-head h2 { margin: 0; color: var(--navy); font-family: Georgia, "Noto Serif SC", serif; font-size: 23px; }
    .theme-head > .bilingual-box { margin-top: 8px; }

    .compact-panel { margin-bottom: 10px; }
    @keyframes softGlow {
      0%, 100% { text-shadow: 0 0 0 rgba(43,103,137,0); }
      50% { text-shadow: 0 0 10px rgba(43,103,137,.28); }
    }
    .report-layout { display: grid; grid-template-columns: 218px minmax(0, 1fr); gap: 18px; align-items: start; margin-top: 14px; }
    .side-nav { position: sticky; top: 14px; display: grid; gap: 4px; max-height: calc(100vh - 28px); overflow: auto; padding: 10px; background: rgba(255,255,255,.96); border: 1px solid var(--line); border-left: 4px solid var(--teal); border-radius: 7px; box-shadow: 0 3px 12px rgba(20,35,50,.05); }
    .side-nav a { display: block; padding: 7px 8px; color: #314557; text-decoration: none; border-radius: 4px; font-size: 12px; font-weight: 800; line-height: 1.25; }
    .side-nav a:hover { color: var(--navy); background: var(--soft-teal); }
    .report-content { min-width: 0; }
    .side-nav .nav-subitem { margin-left: 12px; padding-left: 14px; position: relative; color: #496171; font-size: 11px; font-weight: 700; }
    .side-nav .nav-subitem::before { content: ""; position: absolute; left: 4px; top: 50%; width: 5px; height: 5px; margin-top: -2px; border-radius: 50%; background: var(--teal); opacity: .65; }
    .bilingual-box { position: relative; min-width: 0; width: 100%; padding: 10px 12px 11px; background: linear-gradient(180deg, #fbfdfe 0%, #f6fafb 100%); border: 1px solid #d8e2e8; border-radius: 7px; }
    .lang-switch { display: inline-grid; grid-template-columns: repeat(3, minmax(58px, auto)); overflow: hidden; margin: 0 0 9px auto; background: #e9f0f3; border: 1px solid #cbd8df; border-radius: 999px; box-shadow: inset 0 1px 2px rgba(23,50,77,.05); }
    .lang-switch button { min-height: 25px; padding: 4px 10px; color: #496171; background: transparent; border: 0; border-right: 1px solid #cbd8df; cursor: pointer; font-size: 11px; font-weight: 800; white-space: nowrap; }
    .lang-switch button:last-child { border-right: 0; }
    .lang-switch button.active { color: #fff; background: linear-gradient(135deg, var(--blue), var(--teal)); box-shadow: 0 2px 8px rgba(43,103,137,.18); }
    .lang-panel { display: none; }
    .bilingual-box[data-view="both"] .lang-both,
    .bilingual-box[data-view="zh"] .lang-zh,
    .bilingual-box[data-view="en"] .lang-en { display: block; }
    .bilingual-pair { padding: 7px 0 8px; border-top: 1px solid #e5edf1; }
    .bilingual-pair:first-child { padding-top: 0; border-top: 0; }
    .line-en, .line-zh, .lang-panel > p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .line-en { color: #24384a; font-family: Georgia, "Times New Roman", serif; font-size: 13px; line-height: 1.48; }
    .line-zh { margin-top: 3px; color: #4b5f6f; font-size: 12px; line-height: 1.62; padding-left: 1.2em; border-left: 3px solid #d5e6e2; }
    .lang-zh > p { color: #344454; line-height: 1.72; }
    .lang-en > p { color: #24384a; font-family: Georgia, "Times New Roman", serif; line-height: 1.58; }
    .missing { color: #8a98a5; font-style: italic; }
    .plain-note { width: 100%; color: #516273; }
    .catalog-group { margin-top: 12px; }
    .group-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; align-items: baseline; padding: 9px 12px; color: #243747; background: #f7fafb; border: 1px solid var(--line); border-left: 4px solid var(--teal); border-radius: 6px 6px 0 0; }
    .group-head h2 { margin: 0; color: var(--navy); font-family: Georgia, "Noto Serif SC", serif; font-size: 17px; line-height: 1.25; }
    .group-head p { grid-column: 1 / -1; margin: 0; color: #526271; font-size: 12px; line-height: 1.45; }
    .group-head span { color: var(--muted); font-size: 12px; font-weight: 800; }
    .paper-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 5px; box-shadow: 0 2px 8px rgba(23,50,77,.03); }
    .paper-row + .paper-row { margin-top: 0; }
    .paper-row.pending-card { background: #fcf5ed; border-color: #dfc9b2; box-shadow: 0 2px 10px rgba(120, 76, 30, .08); }
    .paper-row.pending-card .rank { color: #8f5a24; }
    .paper-row.pending-card .row-title,
    .paper-row.pending-card .paper-title-link,
    .paper-row.pending-card .paper-title-link.no-link { color: #6f4321; }
    .paper-row.pending-card .row-meta { color: #8b6a4f; }
    .row-main { min-width: 0; display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 7px 10px; align-items: baseline; }
    .row-title { min-width: 0; color: var(--navy); font-family: Georgia, "Noto Serif SC", serif; font-size: 15px; font-weight: 800; line-height: 1.35; }
    .paper-title-link { color: var(--navy); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; overflow-wrap: anywhere; }
    .paper-title-link:hover { color: var(--blue); }
    .paper-title-link.no-link { text-decoration-style: dotted; }
    .row-meta { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--muted); font-size: 11px; line-height: 1.35; }
    .row-detail { display: contents; }
    .row-detail summary { grid-column: 2; grid-row: 1; justify-self: end; align-self: center; list-style: none; cursor: pointer; padding: 0 2px; color: var(--blue); background: transparent; border: 0; border-radius: 0; font-size: 12px; font-weight: 900; white-space: nowrap; text-shadow: 0 0 0 rgba(43,103,137,0); animation: softGlow 2.4s ease-in-out infinite; }
    .row-detail summary::-webkit-details-marker { display: none; }
    .row-detail summary:hover { color: var(--teal); text-decoration: underline; text-underline-offset: 3px; }
    .detail-content { grid-column: 1 / -1; grid-row: 2; padding-top: 6px; }
    .detail-field { display: grid; grid-template-columns: 122px minmax(0, 1fr); gap: 10px; align-items: start; padding: 8px 0; border-top: 1px solid #e8ecef; }
    .detail-field:first-of-type { border-top: 0; }
    .detail-field strong { color: var(--muted); font-size: 11px; }
    .detail-field p { margin: 0; color: #344454; white-space: pre-wrap; }
    .basis.full { color: #176346; }
    .basis.partial { color: #90520f; }
    .basis.failed { color: #8b3e38; }
    .empty { padding: 32px; color: var(--muted); text-align: center; background: var(--panel); border: 1px dashed #bbc7d1; border-radius: 8px; }
    footer { margin-top: 34px; padding-top: 14px; color: #7b8791; border-top: 1px solid #cbd4dc; font-size: 11px; text-align: center; }
    [hidden] { display: none !important; }
    @media (max-width: 980px) {
      .report-layout { grid-template-columns: 1fr; }
      .side-nav { position: static; display: flex; overflow-x: auto; max-height: none; }
      .side-nav a { flex: 0 0 auto; }
      .report-head { grid-template-columns: 1fr; }
      .head-side { text-align: left; }
      .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .toolbar { grid-template-columns: 1fr 1fr; }
      .paper-grid, .summary-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 620px) {
      .lang-switch { display: grid; width: 100%; grid-template-columns: repeat(3, 1fr); }
      .line-zh { padding-left: .8em; }
      .paper-row { grid-template-columns: 1fr; }
      .row-detail summary { grid-column: 1; grid-row: 2; justify-self: start; }
      .detail-content { grid-row: 3; }
      .row-main { grid-template-columns: 46px minmax(0, 1fr); }
      .detail-field { grid-template-columns: 1fr; gap: 3px; }
      .page { padding: 12px 11px 42px; }
      .report-head { padding: 23px 20px; }
      .kpi-grid, .toolbar { grid-template-columns: 1fr; }
      .paper-head, .paper-body, .panel, .theme { padding-left: 15px; padding-right: 15px; }
      .field, .compact .field { grid-template-columns: 1fr; gap: 4px; }
      .bar-row { grid-template-columns: 90px minmax(0, 1fr) 35px; }
    }
    @media print {
      body { background: #fff; }
      .page { max-width: none; padding: 0; }
      .report-head { box-shadow: none; }
      .section-nav, .side-nav, .toolbar, .print-btn { display: none !important; }
      .paper-card, .summary-card, .theme { break-inside: avoid; box-shadow: none; }
    }
    {{EXTRA_CSS}}
  </style>
</head>
<body>
  <main class="page">
    <header class="report-head">
      <div>
        <div class="eyebrow">{{EYEBROW}}</div>
        <h1>{{PAGE_TITLE}}</h1>
        <div class="subtitle">{{SUBTITLE}}</div>
      </div>
      <div class="head-side">
        <div>{{GENERATED_AT}}</div>
        <button class="print-btn" type="button" onclick="window.print()">{{PRINT_LABEL}}</button>
      </div>
    </header>
    {{BODY}}
    <footer>{{FOOTER}}</footer>
  </main>
  <script>{{SCRIPT}}</script>
</body>
</html>
